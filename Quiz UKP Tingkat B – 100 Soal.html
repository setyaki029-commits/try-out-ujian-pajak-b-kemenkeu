const L="ABCD";let U=new Array(100).fill(-1),fin=false;
const $=i=>document.getElementById(i);
function build(){const h=[];Q.forEach((s,i)=>{const p=s.split("|");if(P[i+1])h.push(`<div class="part">${P[i+1]}</div>`);
h.push(`<div class="q" id="q${i}"><p>${i+1}. ${p[0]}</p>${p.slice(1).map((o,j)=>`<button class="o" data-i="${i}" data-j="${j}"><b>${L[j]}.</b> ${o}</button>`).join("")}<div class="fb"></div></div>`)});
$("list").innerHTML=h.join("")}
function mark(i,reveal){const q=$("q"+i),k=L.indexOf(K[i]);q.querySelectorAll(".o").forEach((b,j)=>{b.classList.remove("s","ok","no");if(reveal){if(j===k)b.classList.add("ok");else if(j===U[i])b.classList.add("no")}else if(j===U[i])b.classList.add("s")});
q.classList.toggle("done",reveal);q.querySelector(".fb").textContent=reveal?(U[i]===k?"✓ Benar":(U[i]<0?"Tidak dijawab. ":"✗ Salah. ")+"Kunci: "+K[i]):""}
function stat(){const a=U.filter(x=>x>=0).length,c=U.filter((x,i)=>x===L.indexOf(K[i])).length;$("ans").textContent=a;$("cor").textContent=c;$("pb").style.width=a+"%";return[a,c]}
$("list").addEventListener("click",e=>{const b=e.target.closest(".o");if(!b||fin)return;const i=+b.dataset.i,j=+b.dataset.j;
if($("imm").checked&&U[i]>=0)return;U[i]=j;mark(i,$("imm").checked);stat()});
$("fin").onclick=()=>{fin=true;const[a,c]=stat(),s=c,w=a-c,k=100-a;for(let i=0;i<100;i++)mark(i,true);
const g=s>=80?"Sangat baik 🎉":s>=70?"Baik":s>=60?"Cukup – perlu belajar lagi":"Perlu belajar lebih banyak";
const r=$("res");r.style.display="block";r.innerHTML=`<div>Skor Akhir</div><div class="n">${s}/100</div><div>Nilai: <b>${s}</b> · ${g}</div><p>Benar: <b>${c}</b> · Salah: <b>${w}</b> · Tidak dijawab: <b>${k}</b></p>`;r.scrollIntoView({behavior:"smooth"})};
$("rst").onclick=()=>{U.fill(-1);fin=false;$("res").style.display="none";for(let i=0;i<100;i++)mark(i,false);stat();scrollTo(0,0)};
build();stat();
</script></body></html>
